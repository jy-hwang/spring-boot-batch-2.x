server:
  port: 6080

spring:
  application:
    name: batch-project
  datasource:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      data-locations: classpath:insert_person.sql
      #schema-locations: classpath:create_person.sql
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
